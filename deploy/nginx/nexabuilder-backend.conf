# NexaBuilder — Nginx config
# Portals (admin/call/contractor) served via EC2 Nginx — CloudFront handles their SSL
# api.nexabuilder.com gets its own server block with SSL + proxy to :8000

# ── HTTP redirect for all domains → HTTPS ────────────────────────────────────
server {
    listen 80;
    server_name
        admin.nexabuilder.com
        call.nexabuilder.com
        contractor.nexabuilder.com
        api.nexabuilder.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── admin.nexabuilder.com  (SPA + API proxy) ─────────────────────────────────
server {
    listen 443 ssl;
    server_name admin.nexabuilder.com;

    ssl_certificate     /etc/letsencrypt/live/admin.nexabuilder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.nexabuilder.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/nexabuilder/frontend/admin-console;
    index index.html;
    client_max_body_size 20M;


    # Guides Admin — exact match, highest priority, before SPA catch-all
    location = /guides-admin {
        root /var/www/nexabuilder/frontend/admin-console;
        try_files /guides-admin.html =404;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /guides-admin.html {
        root /var/www/nexabuilder/frontend/admin-console;
        try_files /guides-admin.html =404;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    # SEO Meta Manager — exact match, highest priority, before SPA catch-all
    location = /seo-meta-manager {
        root /var/www/nexabuilder/frontend/admin-console;
        try_files /seo-meta-manager.html =404;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /seo-meta-manager.html {
        root /var/www/nexabuilder/frontend/admin-console;
        try_files /seo-meta-manager.html =404;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location / {
        alias /var/www/nexabuilder/frontend/admin-console/;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location /assets/ {
        alias /var/www/nexabuilder/frontend/admin-console/assets/;
    }



    location = /chat-widget.js {
        alias /var/www/nexabuilder/static/chat-widget.js;
        add_header Content-Type "application/javascript";
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=300";
    }
    # Routes that already have /api prefix — pass through directly
    location ~ ^/api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
    location ~ ^/(auth|health)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
    # Frontend calls these without /api prefix — rewrite to add /api
    location ~ ^/(admin|seo-content|blog|contractors|call-center|seo-audit|cdm)/ {
        rewrite ^/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
}

