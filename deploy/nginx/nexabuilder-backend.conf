# ── api.nexabuilder.com — pure API reverse proxy ──────────────────────────────
server {
    listen 443 ssl;
    server_name api.nexabuilder.com;

    ssl_certificate     /etc/letsencrypt/live/api.nexabuilder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nexabuilder.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # CORS headers for browser requests
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS,PATCH" always;
    add_header Access-Control-Allow-Headers "Content-Type,Authorization,X-Admin-Key,X-CMS-Key" always;

    # Recovery endpoints — long timeout for AI operations (apply-full-fix, review-page)
    location ~ ^/api/seo-content/recovery/(apply-full-fix|review-page) {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS,PATCH" always;
            add_header Access-Control-Allow-Headers "Content-Type,Authorization,X-Admin-Key,X-CMS-Key" always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_read_timeout 360s;
        proxy_connect_timeout 30;
        proxy_send_timeout 360s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS,PATCH" always;
        add_header Access-Control-Allow-Headers "Content-Type,Authorization,X-Admin-Key,X-CMS-Key" always;
    }

    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS,PATCH" always;
            add_header Access-Control-Allow-Headers "Content-Type,Authorization,X-Admin-Key,X-CMS-Key" always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS,PATCH" always;
        add_header Access-Control-Allow-Headers "Content-Type,Authorization,X-Admin-Key,X-CMS-Key" always;
    }
}
