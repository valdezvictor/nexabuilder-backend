<!DOCTYPE html>
<html lang="{{ lang | default('en') }}" class="page-{{ page_id }} lang-{{ lang | default('en') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ title | default('NexaBuilder') }}{% endblock %}</title>
  <meta name="description" content="{{ meta_description | default('') }}">
  <link rel="canonical" href="{{ canonical }}">
  <link rel="alternate" hreflang="en" href="{{ hreflang_en }}">
  <link rel="alternate" hreflang="es" href="{{ hreflang_es }}">
  {% block extra_head %}{% endblock %}

  <!-- Default LocalBusiness JSON-LD — overridable per page via block schema_json -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "NexaBuilder",
    "description": "Licensed contractor matching platform for Southern California. 243,000+ CSLB-verified contractors.",
    "url": "https://www.nexabuilder.com",
    "telephone": "+12138784536",
    "email": "info@nexabuilder.com",
    "license": "CSLB License #1127866",
    "areaServed": [
      {"@type": "State", "name": "California"},
      {"@type": "City", "name": "Los Angeles"},
      {"@type": "City", "name": "Orange County"},
      {"@type": "City", "name": "San Diego"},
      {"@type": "City", "name": "Riverside"},
      {"@type": "City", "name": "San Bernardino"}
    ],
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Construction & Home Improvement Services",
      "itemListElement": [
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Pool Installation"}},
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Home Remodeling"}},
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Roofing"}},
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Electrical"}},
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Plumbing"}},
        {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Landscaping"}}
      ]
    },
    "sameAs": [
      "https://www.facebook.com/nexabuilder",
      "https://www.instagram.com/nexabuilder"
    ]
  }
  </script>
  {% block schema_json %}{% endblock %}

  <style>
    /* ── NexaBuilder Design Tokens ── */
    :root {
      --nb-navy:   #0a1628;
      --nb-blue:   #1d6fde;
      --nb-gold:   #c8922a;
      --nb-white:  #ffffff;
      --nb-gray:   #f5f7fa;
      --nb-text:   #1a1a2e;
      --nb-muted:  #6b7280;
      --nb-radius: 8px;
      --nb-font:   'Inter', system-ui, -apple-system, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--nb-font);
      color: var(--nb-text);
      background: var(--nb-white);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    a { color: var(--nb-blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; height: auto; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    main { flex: 1; }
  </style>
</head>
<body>
  {% include "partials/header.html" %}

  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}
  {% include "partials/lang_toggle.html" %}

  {% block extra_scripts %}{% endblock %}
</body>
</html>
